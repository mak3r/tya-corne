# Mouse keys (layer 4: &mkp clicks, &mmv movement, &msc scroll).
CONFIG_ZMK_POINTING=y

# Make zmk-raw-hid's interface look exactly like QMK's CONSOLE_ENABLE one
# (usage page 0xFF31, usage 0x74, 32-byte reports): corne-kbd-hud finds the
# keyboard by these two values, not VID/PID, so the HUD needs no changes.
# Only takes effect on the left (central) build, which adds raw_hid_adapter.
CONFIG_RAW_HID_USAGE_PAGE=0xFF31
CONFIG_RAW_HID_USAGE=0x74
CONFIG_RAW_HID_REPORT_SIZE=32

# Deep sleep after 15 min idle (any key wakes it) -- battery life.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
